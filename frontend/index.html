<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary Meta Tags ─── -->
    <title>Kisher.Shop — Buy Game Keys, Gift Cards & Top-Ups in Bangladesh</title>
    <meta name="title" content="Kisher.Shop — Buy Game Keys, Gift Cards & Top-Ups in Bangladesh" />
    <meta
      name="description"
      content="Kisher.Shop is Bangladesh's trusted digital marketplace for game keys, gift cards, mobile top-ups, game accounts, and boosting services. Instant delivery, bKash & Nagad payments, 24/7 support."
    />
    <meta
      name="keywords"
      content="game keys bangladesh, gift cards bangladesh, mobile top up bd, steam wallet bd, pubg uc bd, free fire diamonds bd, game accounts bangladesh, bKash payment, Nagad payment, kisher shop, kishershop"
    />
    <meta name="author" content="Kisher.Shop" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="theme-color" content="#0f172a" />

    <!-- ─── Canonical ─── -->
    <link rel="canonical" href="https://kisher.shop/" />

    <!-- ─── Open Graph / Facebook ─── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kisher.Shop" />
    <meta property="og:url" content="https://kisher.shop/" />
    <meta property="og:title" content="Kisher.Shop — Buy Game Keys, Gift Cards & Top-Ups in Bangladesh" />
    <meta
      property="og:description"
      content="Bangladesh's trusted digital marketplace for game keys, gift cards, mobile top-ups, game accounts, and boosting services. Instant delivery, bKash & Nagad payments, 24/7 support."
    />
    <meta property="og:image" content="https://kisher.shop/favicon.svg" />
    <meta property="og:image:alt" content="Kisher.Shop — Your Digital Marketplace" />
    <meta property="og:locale" content="en_US" />

    <!-- ─── Twitter ─── -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kisher.Shop — Buy Game Keys, Gift Cards & Top-Ups in Bangladesh" />
    <meta
      name="twitter:description"
      content="Bangladesh's trusted digital marketplace for game keys, gift cards, mobile top-ups, game accounts, and boosting services. Instant delivery, bKash & Nagad payments."
    />
    <meta name="twitter:image" content="https://kisher.shop/favicon.svg" />

    <!-- ─── Preconnect for performance ─── -->
    <link rel="preconnect" href="https://kisher.shop" />

    <!-- ─── Structured Data: Organization ─── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Kisher.Shop",
        "url": "https://kisher.shop/",
        "logo": "https://kisher.shop/favicon.svg",
        "description": "Bangladesh's trusted digital marketplace for game keys, gift cards, mobile top-ups, game accounts, and boosting services.",
        "areaServed": "BD",
        "currenciesAccepted": "BDT",
        "paymentAccepted": "bKash, Nagad",
        "sameAs": ["https://github.com/sirfakey/kishershop/"]
      }
    </script>

    <!-- ─── Structured Data: WebSite (with SearchAction) ─── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kisher.Shop",
        "url": "https://kisher.shop/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://kisher.shop/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
